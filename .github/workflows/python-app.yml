name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Get code
      uses: actions/checkout@v4

    - name: Run Mac build script
      run: bash build_mac.sh

    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: MacBuild
        path: |
          dist
          build
          *.app
